name: Release candidate validation

on:
  push:
    branches:
      - "release-candidate/**"
  pull_request:
    branches:
      - "release-candidate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test JavaScript and Worker suites (includes Supabase/Postgres suites via PGlite)
        run: node --test *.test.js worker/*.test.mjs

      - name: Type-check the TypeScript Worker modules (strict)
        run: npx tsc -p tsconfig.json

      - name: End-to-end test of Challenge an Assessment (real Worker on PGlite, Chrome)
        env:
          E2E_BROWSER_CHANNEL: chrome
        run: node scripts/challenge-e2e.mjs "${{ runner.temp }}/e2e-screens"

      - name: Test Python suites
        run: python -m unittest discover -s . -q

      - name: Test migration and restore suite
        run: python -m unittest test_phase6_migration -v

      - name: Build Worker without deploying
        run: npx --yes wrangler@4.158.0 deploy --dry-run
