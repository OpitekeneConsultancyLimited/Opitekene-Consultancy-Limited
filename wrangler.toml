name = "taxcomp-uganda-chat"
main = "worker/index.mjs"
compatibility_date = "2026-10-31"
# Required by the `postgres` driver used for Supabase (worker/db.mjs).
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["15 2 * * *"]

[vars]
ALLOWED_ORIGIN = "https://opitekeneconsultancylimited.github.io"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Supabase project (public URL). Phase 6 sign-in (Supabase Auth) and documents
# (Supabase Storage) also need the SUPABASE_SERVICE_ROLE_KEY Worker secret.
SUPABASE_URL = "https://xbooviddjkikcbccfcnw.supabase.co"
# Public (publishable) key, the same one the site's pages carry. Lets the admin
# pages sign a named administrator in with email, password and two-step code.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IdpY6dnVzJXUl05vqTlHmg_Xta-oZRF"
# N8: the old shared ADMIN_DASHBOARD_TOKEN still works while this is "true" (every
# use is logged; it never reaches launch gates). Set to "false" once each
# administrator signs in with their own account (docs/remediation/ACCESS_CONTROLS.md).
ADMIN_SHARED_TOKEN_ENABLED = "true"
# M4: reviewers and administrators must have signed in with two-step
# verification. Leave unset (= required); "false" exists only for tests.
# PRIVILEGED_MFA_REQUIRED = "false"
# Paid accounts (worker/billing.mjs, BILLING.md). Checkout works once the
# FLW_SECRET_KEY and FLW_WEBHOOK_HASH secrets are set (Flutterwave dashboard);
# until then the site says online payment is being set up.
BILLING_ENABLED = "true"
PUBLIC_SITE_URL = "https://opitekeneconsultancylimited.github.io/Opitekene-Consultancy-Limited/taxcomp/"
# ClamAV document scanner (scanner/README.md). Set to the deployed https URL;
# also needs the MALWARE_SCANNER_TOKEN secret. Empty = uploads stay disabled.
MALWARE_SCANNER_URL = ""
PHASE10_OPERATIONS_ANALYTICS_ENABLED = "false"
# Deploy-time launch flags. Launch also needs every gate approved, with evidence,
# in the launch-gate register (/admin/gates); see LAUNCH_GATE_REGISTER.md.
PHASE11_LEGAL_REVIEW_APPROVED = "false"
PHASE11_TAX_CALCULATION_APPROVED = "false"
PHASE11_SECURITY_REVIEW_APPROVED = "false"
PHASE11_PRIVACY_REVIEW_APPROVED = "false"
PHASE11_OPERATIONS_READY = "false"
PHASE11_BILLING_PROVIDER_CONFIGURED = "false"
PHASE11_SUPPORT_PROCESS_READY = "false"
PHASE11_PUBLIC_LAUNCH_APPROVED = "false"

# Supabase Postgres through Cloudflare Hyperdrive: LIVE in production since
# 2026-11-09 (version c787b592). Remove this block and redeploy (or
# `wrangler rollback 7c86d391-0856-4b18-b238-8f8b6f8d5264`) to fall back to D1.
# Config "taxcomp-supabase" points at Supabase project xbooviddjkikcbccfcnw as
# role taxcomp_worker (see SUPABASE_MIGRATION.md).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "1ec8106d082a4e309115ab818454fc8b"

# Legacy D1 database. Kept during the Supabase cutover for rollback.
[[d1_databases]]
binding = "UNANSWERED_QUESTIONS"
database_name = "taxcomp-unanswered-questions"
database_id = "a89c9234-d515-4427-9373-f9d7f565398f"
migrations_dir = "worker/migrations"

[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "726194"
simple = { limit = 8, period = 60 }
