name = "taxcomp-uganda-chat"
main = "worker/index.mjs"
compatibility_date = "2026-10-31"
# Required by the `postgres` driver used for Supabase (worker/db.mjs).
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["15 2 * * *"]

[vars]
ALLOWED_ORIGIN = "https://opitekeneconsultancylimited.github.io"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Supabase project (public URL). Phase 6 sign-in (Supabase Auth) and documents
# (Supabase Storage) also need the SUPABASE_SERVICE_ROLE_KEY Worker secret.
SUPABASE_URL = "https://xbooviddjkikcbccfcnw.supabase.co"
PHASE10_OPERATIONS_ANALYTICS_ENABLED = "false"
PHASE11_LEGAL_REVIEW_APPROVED = "false"
PHASE11_SECURITY_REVIEW_APPROVED = "false"
PHASE11_PRIVACY_REVIEW_APPROVED = "false"
PHASE11_OPERATIONS_READY = "false"
PHASE11_BILLING_PROVIDER_CONFIGURED = "false"
PHASE11_SUPPORT_PROCESS_READY = "false"
PHASE11_PUBLIC_LAUNCH_APPROVED = "false"

# Supabase Postgres through Cloudflare Hyperdrive. When this binding exists the
# Worker uses Supabase for all data; remove it to fall back to the D1 binding
# below. Config "taxcomp-supabase" (created 2026-11-09) points at Supabase
# project xbooviddjkikcbccfcnw as role taxcomp_worker. To switch production to
# Supabase, uncomment the three lines below (see SUPABASE_MIGRATION.md, "Cut over").
# It was created with:
#   npx wrangler hyperdrive create taxcomp-supabase --connection-string="<Supabase session pooler URL>"
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "1ec8106d082a4e309115ab818454fc8b"

# Legacy D1 database. Kept during the Supabase cutover for rollback.
[[d1_databases]]
binding = "UNANSWERED_QUESTIONS"
database_name = "taxcomp-unanswered-questions"
database_id = "a89c9234-d515-4427-9373-f9d7f565398f"
migrations_dir = "worker/migrations"

[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "726194"
simple = { limit = 8, period = 60 }
